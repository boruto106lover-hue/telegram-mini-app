<!DOCTYPE html>
<html>
<head>
  <title>Foxen Task</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase (COMPAT version for GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #334155;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>

<body>

<h2>💰 Earn Hub Pro</h2>

<div class="card">
  <p id="points">Points: 0</p>
  <button onclick="tap()">Tap & Earn</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let points = 0;

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBaR28QuaFmSAMR2BLmtuLf_2VMk5A929k",
  authDomain: "earn-app-da515.firebaseapp.com",
  projectId: "earn-app-da515",
  storageBucket: "earn-app-da515.firebasestorage.app",
  messagingSenderId: "872148195161",
  appId: "1:872148195161:web:aad2bae385c5bddcda9e48"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* TAP FUNCTION */
function tap(){
  points++;
  document.getElementById("points").innerText = "Points: " + points;

  // SAVE TO FIREBASE
  db.collection("users").doc("testuser").set({
    points: points,
    ref: "none"
  });
}
</script>

</body>
</html>
