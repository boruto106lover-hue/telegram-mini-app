<!DOCTYPE html>
<html>
<head>
  <title>Foxen Task</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #334155;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>
<body>

<h2>💰 Earn Hub Pro</h2>

<div class="card">
  <p id="points">Points: 0</p>
  <button onclick="tap()">Tap & Earn</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let points = 0;

function tap(){
  points++;
  document.getElementById("points").innerText = "Points: " + points;
}
</script>

</body>
</html>
